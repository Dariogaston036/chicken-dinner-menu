<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chicken Dinner - Menú</title>
<link rel="icon" href="data:,">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', sans-serif; background:#170F0C; }
  .display-font { font-family: 'Anton', sans-serif; }
  .mono-font { font-family: 'JetBrains Mono', monospace; }
  .page { min-height:100vh; padding-bottom:100px; }
  .container { max-width:1024px; margin:0 auto; padding:0 20px; }

  .header { display:flex; align-items:center; justify-content:space-between; padding:18px 20px; position:sticky; top:0; background:#170F0C; z-index:30; border-bottom:2px solid #2c1c14; }
  .brand-mark { display:flex; align-items:center; gap:8px; }
  .target-icon { flex-shrink:0; }
  .brand-text { font-size:13px; letter-spacing:2px; color:#F3E8D2; }
  .cart-btn { position:relative; background:#C1391E; color:#F3E8D2; border:2px solid #F3E8D2; border-radius:999px; padding:9px 16px; font-size:13px; font-weight:bold; display:flex; align-items:center; gap:6px; }
  .cart-count { background:#F2C230; color:#170F0C; border-radius:999px; min-width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:11px; padding:0 5px; }

  .hero { text-align:center; padding:36px 20px 20px; position:relative; }
  .hero-eyebrow { display:inline-flex; align-items:center; gap:6px; font-size:12px; letter-spacing:2px; color:#F2C230; background:#241812; border:1px solid #3a2419; padding:5px 14px; border-radius:999px; margin-bottom:18px; }
  .hero h1 { color:#F3E8D2; font-size:clamp(2.4rem,9vw,4rem); line-height:0.92; margin:0 0 6px; text-shadow: 3px 3px 0 #C1391E; }
  .hero h1 .accent { color:#E8A33D; text-shadow:3px 3px 0 #170F0C; -webkit-text-stroke:1.5px #F3E8D2; }
  .hero p { color:#c9b8a3; font-size:14px; margin:14px auto 0; max-width:420px; }

  .heat-legend { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:22px; flex-wrap:wrap; }
  .heat-legend-item { display:flex; align-items:center; gap:5px; font-size:11px; color:#8a7160; }
  .flame-dot { width:9px; height:9px; border-radius:50%; }

  .section-title { display:flex; align-items:center; gap:10px; margin:40px 0 16px; }
  .section-title-text { color:#F3E8D2; font-size:1.4rem; }
  .section-title-rule { flex:1; height:2px; background:repeating-linear-gradient(90deg,#3a2419 0,#3a2419 6px,transparent 6px,transparent 12px); }

  .grid { display:grid; gap:18px; grid-template-columns:1fr; }
  @media(min-width:640px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media(min-width:900px){ .grid.sauces{grid-template-columns:repeat(3,1fr);} }

  .card { background:#221712; border:2px solid #3a2419; border-radius:18px; overflow:hidden; display:flex; flex-direction:column; }
  .sticker-frame { padding:10px; background:#221712; }
  .sticker-frame .card-img-wrap { border:4px solid #F3E8D2; border-radius:12px; box-shadow: 0 0 0 2px #170F0C; }
  .card-img-wrap { width:100%; aspect-ratio:1/1; overflow:hidden; background:#170F0C; }
  .card-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-body { padding:14px 16px 16px; display:flex; flex-direction:column; flex:1; }
  .card-name { color:#F3E8D2; font-size:1.15rem; margin:0 0 6px; }
  .card-desc { color:#b8a58f; font-size:13px; margin:0 0 14px; line-height:1.5; flex:1; }

  .variant-row { display:flex; gap:8px; margin-bottom:14px; }
  .variant-btn { flex:1; padding:8px; border-radius:8px; border:1px solid #3a2419; background:transparent; color:#d9cdbc; font-size:12px; cursor:pointer; }
  .variant-btn.active { background:#E8A33D; color:#170F0C; border-color:#E8A33D; font-weight:bold; }

  .price-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .price { color:#F3E8D2; font-size:1.35rem; }
  .add-btn { width:100%; padding:12px; border-radius:8px; border:none; background:#C1391E; color:#F3E8D2; font-weight:bold; font-size:13px; cursor:pointer; letter-spacing:0.5px; }
  .add-btn.small { padding:9px; font-size:12px; }

  .heat-gauge { display:flex; align-items:center; gap:4px; margin-bottom:10px; }
  .heat-gauge .flame { width:14px; height:14px; opacity:0.25; }
  .heat-gauge .flame.lit { opacity:1; }
  .heat-label { font-size:11px; color:#8a7160; margin-left:6px; }

  .sauce-note { text-align:center; color:#8a7160; font-size:12px; margin:0 0 16px; }

  .cart-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:50; display:flex; justify-content:flex-end; }
  .cart-panel { width:100%; max-width:420px; background:#170F0C; height:100%; overflow-y:auto; padding:20px; }
  .cart-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .cart-title { color:#F3E8D2; font-size:1.4rem; }
  .close-btn { background:none; border:none; color:#8a7160; font-size:22px; cursor:pointer; }
  .cart-item { display:flex; gap:10px; padding:12px 0; border-bottom:1px solid #2c1c14; }
  .cart-item img { width:56px; height:56px; border-radius:8px; object-fit:cover; flex-shrink:0; border:2px solid #F3E8D2; }
  .cart-item-info { flex:1; }
  .cart-item-name { color:#F3E8D2; font-size:14px; margin:0 0 2px; }
  .cart-item-variant { color:#8a7160; font-size:12px; margin:0 0 6px; }
  .qty-row { display:flex; align-items:center; gap:10px; }
  .qty-btn { width:24px; height:24px; border-radius:6px; border:1px solid #3a2419; background:transparent; color:#F3E8D2; font-size:14px; cursor:pointer; }
  .qty-num { color:#F3E8D2; font-size:13px; min-width:16px; text-align:center; }
  .cart-item-price { color:#F2C230; font-size:13px; font-weight:bold; margin-left:auto; }
  .remove-btn { background:none; border:none; color:#8a7160; font-size:12px; text-decoration:underline; cursor:pointer; padding:0; margin-top:6px; }
  .empty-cart { color:#8a7160; text-align:center; padding:60px 20px; font-size:14px; }
  .cart-footer { position:sticky; bottom:0; background:#170F0C; padding-top:16px; margin-top:16px; border-top:1px solid #2c1c14; }
  .total-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .total-label { color:#8a7160; font-size:13px; }
  .total-amount { color:#F3E8D2; font-size:1.6rem; }
  .checkout-btn { width:100%; padding:15px; border-radius:10px; border:none; background:#25D366; color:#0d2b18; font-weight:bold; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }

  .floating-cart { position:fixed; bottom:16px; left:16px; right:16px; max-width:400px; margin:0 auto; z-index:40; }
  .floating-cart button { width:100%; padding:14px; border-radius:12px; border:2px solid #F3E8D2; background:#C1391E; color:#F3E8D2; font-weight:bold; font-size:14px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 16px rgba(0,0,0,0.5); }

  .footer-note { text-align:center; margin-top:44px; font-size:12px; color:#5c4433; }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;background:#170F0C;display:flex;align-items:center;justify-content:center;">
    <p style="color:#8a7160;font-family:sans-serif;font-size:14px;">Cargando menú...</p>
  </div>
</div>

<script>
const e = React.createElement;
const { useState, useMemo } = React;

const WHATSAPP_NUMBER = "5491130370442";

/* ---------- Productos ---------- */
const BURGERS = [
  {
    id: "melt",
    name: "Chicken Dinner Melt",
    desc: "Pan dorado a la manteca, pollo frito crujiente, doble cheddar fundido y cebollas caramelizadas.",
    img: "burger-melt.webp",
    variants: [ { id: "simple", label: "Simple", price: 9000 }, { id: "doble", label: "Doble", price: 11000 } ]
  },
  {
    id: "eggmount",
    name: "Fried Egg Mount",
    desc: "Capas de pollo frito bien crocante con un huevo frito arriba, en pan brioche.",
    img: "burger-eggmount.webp",
    variants: [ { id: "simple", label: "Simple", price: 9000 }, { id: "doble", label: "Doble", price: 11000 } ]
  },
  {
    id: "smokey",
    name: "Smokey Rickly",
    desc: "Pollo frito crujiente con pepinillos y salsa especial, en pan brioche tostado.",
    img: "burger-smokey.webp",
    variants: [ { id: "simple", label: "Simple", price: 9000 }, { id: "doble", label: "Doble", price: 11000 } ]
  },
];

const SIDES = [
  {
    id: "fries",
    name: "Papas Nashville",
    desc: "Porción grande, crujientes por fuera y suaves por dentro, con sazón estilo Nashville Hot.",
    img: "fries-nashville.webp",
    price: 5000
  },
  {
    id: "wings",
    name: "Alitas x8",
    desc: "8 unidades de alitas de pollo frito, bien crocantes.",
    img: null,
    price: 7500
  },
];

// heat: 1-4 (nivel de picante real de cada salsa)
const SAUCES = [
  { id: "mostaza", name: "Mostaza y Miel", img: "sauce-mostaza.webp", price: 1000, heat: 1 },
  { id: "garlic", name: "Garlic Boom", img: "sauce-garlic.webp", price: 1000, heat: 1 },
  { id: "buffalo", name: "Buffalo Picante", img: "sauce-buffalo.webp", price: 1000, heat: 3 },
  { id: "mango", name: "Mango Habanero", img: "sauce-mango.webp", price: 1500, heat: 3 },
  { id: "picante", name: "Muy Picante (Ají de árbol)", img: "sauce-picante.webp", price: 1000, heat: 4 },
];

function money(n) { return "$" + n.toLocaleString("es-AR"); }

/* ---------- Iconos ---------- */
function CartIcon(p) {
  return e("svg", { width: p.size||18, height: p.size||18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    e("circle", { cx: 9, cy: 21, r: 1 }),
    e("circle", { cx: 20, cy: 21, r: 1 }),
    e("path", { d: "M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" })
  );
}
function TargetIcon(p) {
  return e("svg", { width: p.size||26, height: p.size||26, viewBox: "0 0 24 24", fill: "none", stroke: "#C1391E", strokeWidth: 2 },
    e("circle", { cx: 12, cy: 12, r: 9 }),
    e("circle", { cx: 12, cy: 12, r: 5 }),
    e("circle", { cx: 12, cy: 12, r: 1.4, fill: "#C1391E" })
  );
}
function FlameDot({ lit }) {
  return e("svg", { className: "flame" + (lit ? " lit" : ""), viewBox: "0 0 24 24", fill: lit ? "#C1391E" : "#5c4433" },
    e("path", { d: "M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" })
  );
}

/* ---------- App ---------- */
function App() {
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);

  const addItem = (item) => {
    setCart((prev) => {
      const existing = prev.find((i) => i.key === item.key);
      if (existing) return prev.map((i) => i.key === item.key ? { ...i, qty: i.qty + 1 } : i);
      return [...prev, { ...item, qty: 1 }];
    });
    setCartOpen(true);
  };

  const changeQty = (key, delta) => {
    setCart((prev) => prev.map((i) => i.key === key ? { ...i, qty: i.qty + delta } : i).filter((i) => i.qty > 0));
  };

  const removeItem = (key) => setCart((prev) => prev.filter((i) => i.key !== key));

  const total = useMemo(() => cart.reduce((s, i) => s + i.unitPrice * i.qty, 0), [cart]);
  const itemCount = useMemo(() => cart.reduce((s, i) => s + i.qty, 0), [cart]);

  const sendOrder = () => {
    if (cart.length === 0) return;
    let msg = "Hola! Quiero hacer este pedido en Chicken Dinner:\n\n";
    cart.forEach((i) => {
      msg += `• ${i.qty}x ${i.name}${i.variantLabel ? " (" + i.variantLabel + ")" : ""} - ${money(i.unitPrice * i.qty)}\n`;
    });
    msg += `\nTotal: ${money(total)}\n\nMi nombre es: \nMi dirección es: `;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  };

  return e("div", { className: "page" },
    e("div", { className: "header" },
      e("div", { className: "brand-mark" },
        e(TargetIcon, { size: 22 }),
        e("span", { className: "brand-text mono-font" }, "CHICKEN DINNER")
      ),
      e("button", { className: "cart-btn", onClick: () => setCartOpen(true) },
        e(CartIcon, { size: 16 }), "Carrito",
        itemCount > 0 && e("span", { className: "cart-count mono-font" }, itemCount)
      )
    ),

    e("div", { className: "hero" },
      e("span", { className: "hero-eyebrow" }, "🎯 EL SABOR QUE MANDA"),
      e("h1", { className: "display-font" }, "PEDÍ TU ", e("br"), e("span", { className: "accent" }, "CHICKEN DINNER")),
      e("p", null, "Elegí lo que quieras, armá tu pedido y lo confirmamos por WhatsApp."),
      e("div", { className: "heat-legend mono-font" },
        e("span", { className: "heat-legend-item" }, e("span", { className: "flame-dot", style: { background: "#5c4433" } }), "SUAVE"),
        e("span", { className: "heat-legend-item" }, e("span", { className: "flame-dot", style: { background: "#E8A33D" } }), "MEDIO"),
        e("span", { className: "heat-legend-item" }, e("span", { className: "flame-dot", style: { background: "#C1391E" } }), "ARDIENTE")
      )
    ),

    e("div", { className: "container" },
      e(SectionTitle, { text: "HAMBURGUESAS" }),
      e("div", { className: "grid" }, BURGERS.map((b) => e(BurgerCard, { key: b.id, product: b, onAdd: addItem }))),

      e(SectionTitle, { text: "PARA ACOMPAÑAR" }),
      e("div", { className: "grid" }, SIDES.map((s) => e(SimpleCard, { key: s.id, product: s, onAdd: addItem }))),

      e(SectionTitle, { text: "SALSAS" }),
      e("p", { className: "sauce-note" }, "Tu pedido ya viene con salsa incluida. Si querés sumar unidades extra, acá las podés agregar."),
      e("div", { className: "grid sauces" }, SAUCES.map((s) => e(SauceCard, { key: s.id, product: s, onAdd: addItem }))),

      e("p", { className: "footer-note mono-font" }, "Los pedidos se confirman por WhatsApp. El pago se coordina ahí mismo.")
    ),

    itemCount > 0 && !cartOpen && e("div", { className: "floating-cart" },
      e("button", { onClick: () => setCartOpen(true) },
        e("span", null, `Ver carrito (${itemCount})`),
        e("span", null, money(total))
      )
    ),

    cartOpen && e(CartPanel, { cart, total, onClose: () => setCartOpen(false), onChangeQty: changeQty, onRemove: removeItem, onCheckout: sendOrder })
  );
}

function SectionTitle({ text }) {
  return e("div", { className: "section-title" },
    e("span", { className: "section-title-text display-font" }, text),
    e("span", { className: "section-title-rule" })
  );
}

function BurgerCard({ product, onAdd }) {
  const [variantId, setVariantId] = useState(product.variants[0].id);
  const variant = product.variants.find((v) => v.id === variantId);

  return e("div", { className: "card" },
    e("div", { className: "sticker-frame" }, e("div", { className: "card-img-wrap" }, e("img", { src: product.img, alt: product.name }))),
    e("div", { className: "card-body" },
      e("h3", { className: "card-name display-font" }, product.name),
      e("p", { className: "card-desc" }, product.desc),
      e("div", { className: "variant-row" },
        product.variants.map((v) => e("button", {
          key: v.id, className: "variant-btn mono-font" + (v.id === variantId ? " active" : ""), onClick: () => setVariantId(v.id)
        }, v.label))
      ),
      e("div", { className: "price-row" }, e("span", { className: "price display-font" }, money(variant.price))),
      e("button", {
        className: "add-btn mono-font",
        onClick: () => onAdd({ key: product.id + "-" + variant.id, name: product.name, img: product.img, variantLabel: variant.label, unitPrice: variant.price })
      }, "AGREGAR AL CARRITO")
    )
  );
}

function SimpleCard({ product, onAdd }) {
  return e("div", { className: "card" },
    product.img
      ? e("div", { className: "sticker-frame" }, e("div", { className: "card-img-wrap" }, e("img", { src: product.img, alt: product.name })))
      : e("div", { className: "sticker-frame" }, e("div", { className: "card-img-wrap", style: { display: "flex", alignItems: "center", justifyContent: "center", color: "#5c4433", fontSize: 12 } }, "Foto próximamente")),
    e("div", { className: "card-body" },
      e("h3", { className: "card-name display-font" }, product.name),
      e("p", { className: "card-desc" }, product.desc),
      e("div", { className: "price-row" }, e("span", { className: "price display-font" }, money(product.price))),
      e("button", {
        className: "add-btn mono-font",
        onClick: () => onAdd({ key: product.id, name: product.name, img: product.img, variantLabel: null, unitPrice: product.price })
      }, "AGREGAR AL CARRITO")
    )
  );
}

function SauceCard({ product, onAdd }) {
  return e("div", { className: "card" },
    e("div", { className: "sticker-frame" }, e("div", { className: "card-img-wrap" }, e("img", { src: product.img, alt: product.name }))),
    e("div", { className: "card-body" },
      e("h3", { className: "card-name display-font", style: { fontSize: "1rem" } }, product.name),
      e("div", { className: "heat-gauge" },
        [1, 2, 3, 4].map((n) => e(FlameDot, { key: n, lit: n <= product.heat })),
        e("span", { className: "heat-label mono-font" }, product.heat >= 4 ? "ARDIENTE" : product.heat >= 3 ? "PICANTE" : "SUAVE")
      ),
      e("div", { className: "price-row" }, e("span", { className: "price display-font", style: { fontSize: "1.1rem" } }, money(product.price))),
      e("button", {
        className: "add-btn mono-font small",
        onClick: () => onAdd({ key: "sauce-" + product.id, name: product.name, img: product.img, variantLabel: "extra", unitPrice: product.price })
      }, "AGREGAR")
    )
  );
}

function CartPanel({ cart, total, onClose, onChangeQty, onRemove, onCheckout }) {
  return e("div", { className: "cart-overlay", onClick: onClose },
    e("div", { className: "cart-panel", onClick: (ev) => ev.stopPropagation() },
      e("div", { className: "cart-header" },
        e("span", { className: "cart-title display-font" }, "TU PEDIDO"),
        e("button", { className: "close-btn", onClick: onClose }, "\u00d7")
      ),
      cart.length === 0
        ? e("div", { className: "empty-cart" }, "Todav\u00eda no agregaste nada.")
        : e("div", null, cart.map((i) => e("div", { key: i.key, className: "cart-item" },
            i.img ? e("img", { src: i.img, alt: i.name }) : e("div", { style: { width: 56, height: 56, borderRadius: 8, background: "#170F0C", flexShrink: 0 } }),
            e("div", { className: "cart-item-info" },
              e("p", { className: "cart-item-name" }, i.name),
              i.variantLabel && e("p", { className: "cart-item-variant mono-font" }, i.variantLabel),
              e("div", { className: "qty-row" },
                e("button", { className: "qty-btn", onClick: () => onChangeQty(i.key, -1) }, "\u2212"),
                e("span", { className: "qty-num mono-font" }, i.qty),
                e("button", { className: "qty-btn", onClick: () => onChangeQty(i.key, 1) }, "+"),
                e("span", { className: "cart-item-price mono-font" }, money(i.unitPrice * i.qty))
              ),
              e("button", { className: "remove-btn", onClick: () => onRemove(i.key) }, "Quitar")
            )
          ))),
      e("div", { className: "cart-footer" },
        e("div", { className: "total-row" },
          e("span", { className: "total-label mono-font" }, "TOTAL"),
          e("span", { className: "total-amount display-font" }, money(total))
        ),
        e("button", { className: "checkout-btn", onClick: onCheckout, disabled: cart.length === 0 }, "ENVIAR PEDIDO POR WHATSAPP")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
