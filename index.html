/* ---------- Horario: abierto 12:00 a 00:00 todos los días ---------- */
function useIsOpenNow() {
  const [isOpen, setIsOpen] = useState(true);
  useEffect(() => {
    const check = () => { const h = new Date().getHours(); setIsOpen(h >= 12); };
    check(); const id = setInterval(check, 60000); return () => clearInterval(id);
  }, []);
  return isOpen;
}

function useIsNightMode() {
  const [isNight, setIsNight] = useState(false);
  useEffect(() => {
    const check = () => { const h = new Date().getHours(); setIsNight(h >= 22); };
    check(); const id = setInterval(check, 60000); return () => clearInterval(id);
  }, []);
  return isNight;
}

/* ---------- localStorage helpers (sitio real, no artifact) ---------- */
function saveLastOrder(cart) {
  try { localStorage.setItem("cd_last_order", JSON.stringify(cart)); } catch (e) {}
}
function loadLastOrder() {
  try { const raw = localStorage.getItem("cd_last_order"); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function getWheelState() {
  try { return JSON.parse(localStorage.getItem("cd_wheel") || "null"); } catch (e) { return null; }
}
function setWheelState(state) {
  try { localStorage.setItem("cd_wheel", JSON.stringify(state)); } catch (e) {}
}
function loadOrderHistory() {
  try { return JSON.parse(localStorage.getItem("cd_order_history") || "[]"); } catch (e) { return []; }
}
function saveOrderToHistory(cart, total) {
  try {
    const history = loadOrderHistory();
    const entry = { date: new Date().toLocaleString("es-AR"), items: cart, total };
    history.unshift(entry);
    localStorage.setItem("cd_order_history", JSON.stringify(history.slice(0, 5)));
  } catch (e) {}
}
function loadPoints() {
  try { return parseInt(localStorage.getItem("cd_points") || "0"); } catch (e) { return 0; }
}
function addPoints(amount) {
  try { localStorage.setItem("cd_points", String(loadPoints() + amount)); } catch (e) {}
}
function loadStats() {
  try { return JSON.parse(localStorage.getItem("cd_stats") || '{"orders":0,"totalRevenue":0,"products":{}}'); } catch (e) { return { orders: 0, totalRevenue: 0, products: {} }; }
}
function saveStats(cart, total) {
  try {
    const stats = loadStats();
    stats.orders += 1;
    stats.totalRevenue += total;
    cart.forEach((i) => {
      const key = i.name + (i.variantLabel ? " (" + i.variantLabel + ")" : "");
      stats.products[key] = (stats.products[key] || 0) + i.qty;
    });
    localStorage.setItem("cd_stats", JSON.stringify(stats));
  } catch (e) {}
}
function resetStats() {
  try { localStorage.removeItem("cd_stats"); } catch (e) {}
}

/* ---------- Ruleta del hambre: un giro por día ---------- */
function HungerWheel({ onClose, onWin }) {
  const [spinning, setSpinning] = useState(false);
  const [rotation, setRotation] = useState(0);
  const [result, setResult] = useState(null);
  const [alreadyPlayed, setAlreadyPlayed] = useState(false);

  useEffect(() => {
    const state = getWheelState();
    const today = new Date().toDateString();
    if (state && state.date === today) { setAlreadyPlayed(true); setResult(state.percent); }
  }, []);

  const prizes = [5, 10, 0, 15];

  const spin = () => {
    if (spinning || alreadyPlayed) return;
    setSpinning(true);
    const prizeIndex = Math.floor(Math.random() * prizes.length);
    const percent = prizes[prizeIndex];
    const targetDeg = 360 * 4 + (prizeIndex * 90) + 45;
    setRotation(targetDeg);
    setTimeout(() => {
      setSpinning(false);
      setResult(percent);
      setAlreadyPlayed(true);
      setWheelState({ date: new Date().toDateString(), percent });
      if (percent > 0) onWin(percent);
    }, 3000);
  };

  return e("div", { className: "wheel-overlay", onClick: onClose },
    e("div", { className: "wheel-modal", onClick: (ev) => ev.stopPropagation() },
      e("h3", { className: "display-font" }, "RULETA DEL HAMBRE"),
      e("p", null, alreadyPlayed && result !== null ? "Ya tiraste hoy — volvé mañana por otra oportunidad." : "Un giro por día. ¡Probá tu suerte!"),
      e("div", { className: "wheel-circle", style: { transform: `rotate(${rotation}deg)` } },
        e("div", { className: "wheel-circle-inner" }, result !== null ? (result > 0 ? "-" + result + "%" : "😅") : "?")
      ),
      !alreadyPlayed
        ? e("button", { className: "wheel-btn", onClick: spin, disabled: spinning }, spinning ? "GIRANDO..." : "GIRAR LA RULETA")
        : (result > 0
            ? e("p", { style: { color: "#4ade80", fontSize: 13 } }, "¡Ganaste " + result + "% de descuento! Ya se aplicó a tu carrito.")
            : e("p", { style: { color: "#a8a8a8", fontSize: 13 } }, "Esta vez no salió premio. ¡Mañana tenés otra vuelta!")),
      e("button", { className: "wheel-close", onClick: onClose }, "Cerrar")
    )
  );
}

/* ---------- Seguimiento de pedido ---------- */
function TrackingScreen({ onClose }) {
  const STEPS = [
    { icon: "✅", label: "Pedido recibido", time: "Ahora mismo" },
    { icon: "👨‍🍳", label: "En preparación", time: "En ~5 minutos" },
    { icon: "🛵", label: "En camino", time: "En ~20 minutos" },
    { icon: "🏠", label: "Entregado", time: "En ~30 minutos" },
  ];
  const [currentStep, setCurrentStep] = useState(0);
  const [minsLeft, setMinsLeft] = useState(30);

  useEffect(() => {
    const timers = [
      setTimeout(() => setCurrentStep(1), 5000),
      setTimeout(() => setCurrentStep(2), 60000),
      setTimeout(() => setCurrentStep(3), 120000),
    ];
    const countdown = setInterval(() => setMinsLeft((m) => Math.max(0, m - 1)), 60000);
    return () => { timers.forEach(clearTimeout); clearInterval(countdown); };
  }, []);

  return e("div", { className: "tracking-screen" },
    e("div", { className: "tracking-header" },
      e("img", { src: "chicken-logo.png", alt: "", style: { height: 60, marginBottom: 12 } }),
      e("h2", { className: "display-font" }, "¡PEDIDO ENVIADO!"),
      e("p", null, "Te escribimos por WhatsApp para confirmar. Gracias por pedir en Chicken Dinner.")
    ),

    e("div", { className: "tracking-eta" },
      e("div", { className: "tracking-eta-label mono-font" }, "TIEMPO ESTIMADO DE ENTREGA"),
      e("div", { className: "tracking-eta-value display-font" }, currentStep < 3 ? minsLeft + " min" : "¡Listo!")
    ),

    e("div", { className: "tracking-steps" },
      STEPS.map((step, i) => e(React.Fragment, { key: i },
        e("div", { className: "tracking-step" },
          e("div", { className: "tracking-step-icon " + (i < currentStep ? "done" : i === currentStep ? "active" : "pending") }, step.icon),
          e("div", { className: "tracking-step-info" },
            e("p", { className: "tracking-step-label" }, step.label),
            e("p", { className: "tracking-step-time mono-font" }, i <= currentStep ? (i < currentStep ? "✓ Completado" : step.time) : step.time)
          )
        ),
        i < STEPS.length - 1 && e("div", { className: "tracking-connector" + (i < currentStep ? " done" : "") })
      ))
    ),

    e("button", { className: "tracking-back-btn mono-font", onClick: onClose }, "VOLVER AL MENÚ")
  );
}

/* ---------- Panel de estadísticas ---------- */
function StatsPanel({ onClose }) {
  const [stats, setStats] = useState(loadStats());

  const topProducts = Object.entries(stats.products)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);
  const maxCount = topProducts.length > 0 ? topProducts[0][1] : 1;
  const avgTicket = stats.orders > 0 ? Math.round(stats.totalRevenue / stats.orders) : 0;

  const handleReset = () => {
    if (window.confirm("¿Resetear todas las estadísticas?")) {
      resetStats();
      setStats(loadStats());
    }
  };

  return e("div", { className: "stats-overlay", onClick: onClose },
    e("div", { className: "stats-panel", onClick: (ev) => ev.stopPropagation() },
      e("div", { className: "stats-title display-font" },
        "ESTADÍSTICAS",
        e("button", { className: "close-btn", onClick: onClose }, "×")
      ),
      e("p", { style: { color: "#7a7a7a", fontSize: 12, marginTop: -12, marginBottom: 16 } }, "Pedidos realizados desde este dispositivo"),

      e("div", { className: "stats-grid" },
        e("div", { className: "stat-card" },
          e("div", { className: "stat-card-label mono-font" }, "PEDIDOS TOTALES"),
          e("div", { className: "stat-card-value display-font" }, stats.orders)
        ),
        e("div", { className: "stat-card" },
          e("div", { className: "stat-card-label mono-font" }, "TOTAL GASTADO"),
          e("div", { className: "stat-card-value accent display-font" }, money(stats.totalRevenue))
        ),
        e("div", { className: "stat-card" },
          e("div", { className: "stat-card-label mono-font" }, "TICKET PROMEDIO"),
          e("div", { className: "stat-card-value display-font" }, money(avgTicket))
        ),
        e("div", { className: "stat-card" },
          e("div", { className: "stat-card-label mono-font" }, "PRODUCTOS DISTINTOS"),
          e("div", { className: "stat-card-value display-font" }, Object.keys(stats.products).length)
        )
      ),

      topProducts.length > 0 && e("div", null,
        e("div", { className: "top-products-title mono-font" }, "LO QUE MÁS PEDISTE"),
        topProducts.map(([name, count], i) => e("div", { key: i, className: "top-product-row" },
          e("span", { className: "top-product-name" }, name),
          e("div", { className: "top-product-bar-wrap" },
            e("div", { className: "top-product-bar", style: { width: (count / maxCount * 100) + "%" } })
          ),
          e("span", { className: "top-product-count mono-font" }, "×" + count)
        ))
      ),

      stats.orders === 0 && e("p", { style: { color: "#5a5a5a", fontSize: 13, textAlign: "center", padding: "20px 0" } }, "Todavía no hay datos. Hacé tu primer pedido y volvé acá."),

      e("button", { className: "stats-reset-btn mono-font", onClick: handleReset }, "Resetear estadísticas")
    )
  );
}
